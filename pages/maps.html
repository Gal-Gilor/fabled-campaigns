<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Your Realm - Fabled Campaigns</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

    <!-- Custom CSS with color-blind friendly palette -->
    <link rel="stylesheet" href="/css/filter-colors.css">
    <link rel="stylesheet" href="/css/maps.css">

</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">Fabled Campaigns</a>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <a href="/" class="nav-link">Home</a>
                <a href="/pages/quests.html" class="nav-link">Define the Journey</a>
                <a href="/pages/maps.html" class="nav-link active">Chart Your Realm</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <div class="beta-badge">
                <span>Early Access • Site Under Construction</span>
            </div>
            <h1>Chart Your Realm</h1>
        </div>

        <!-- Map Creator -->
        <section class="map-creator">
            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button type="button" class="tab-btn active" data-tab="terrain">Terrain</button>
                <button type="button" class="tab-btn" data-tab="setting">Setting</button>
                <button type="button" class="tab-btn" data-tab="advanced">Homebrew</button>
            </div>
            
            <form id="mapForm" class="create-form">
                <!-- Terrain Tab Content -->
                <div id="terrainTab" class="tab-content active">
                    <div class="form-group">
                        <label for="terrainTypeSimple">Terrain</label>
                        <select id="terrainTypeSimple" required>
                            <option value="forest" selected>Forest</option>
                            <option value="grassland">Grassland</option>
                            <option value="hills">Hills</option>
                            <option value="mountain">Mountain</option>
                            <option value="desert">Desert</option>
                            <option value="tundra">Tundra</option>
                            <option value="jungle">Jungle</option>
                            <option value="swamp">Swamp</option>
                            <option value="ocean">Ocean</option>
                            <option value="coastal">Coastal</option>
                            <option value="underground">Underground</option>
                            <option value="underdark">Underdark</option>
                            <option value="badlands">Badlands</option>
                            <option value="feywild">Feywild</option>
                            <option value="shadowfell">Shadowfell</option>
                            <option value="urban">Urban</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="terrainDescription">You step into... <span class="optional">(optional)</span></label>
                        <textarea id="terrainDescription" placeholder="A mystical forest clearing with ancient stone circles, winding paths, and hidden alcoves perfect for ambushes..."></textarea>
                    </div>
                </div>
                
                <!-- Setting Tab Content -->
                <div id="settingTab" class="tab-content">
                    <div class="form-group">
                        <label for="settingName">Name <span class="optional">(optional)</span></label>
                        <input type="text" id="settingName" placeholder="The Sunken Temple">
                    </div>
                    
                    <div class="form-group">
                        <label for="settingLocationType">Setting</label>
                        <select id="settingLocationType" required>
                            <!-- Options will be populated by script -->
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="settingDescription">You step into... <span class="optional">(optional)</span></label>
                        <textarea id="settingDescription" placeholder="An ancient, waterlogged temple with glowing runes and submerged corridors..."></textarea>
                    </div>
                </div>
                
                <!-- Advanced Tab Content -->
                <div id="advancedTab" class="tab-content">
                    <div class="form-group">
                        <label for="mapName">Name</label>
                        <input type="text" id="mapName" placeholder="The Whispering Woods" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="terrainType">Terrain</label>
                            <select id="terrainType" required>
                                <option value="forest" selected>Forest</option>
                                <option value="grassland">Grassland</option>
                                <option value="hills">Hills</option>
                                <option value="mountain">Mountain</option>
                                <option value="desert">Desert</option>
                                <option value="tundra">Tundra</option>
                                <option value="jungle">Jungle</option>
                                <option value="swamp">Swamp</option>
                                <option value="ocean">Ocean</option>
                                <option value="coastal">Coastal</option>
                                <option value="underground">Underground</option>
                                <option value="underdark">Underdark</option>
                                <option value="badlands">Badlands</option>
                                <option value="feywild">Feywild</option>
                                <option value="shadowfell">Shadowfell</option>
                                <option value="urban">Urban</option>
                                <option value="volcanic">Volcanic</option>
                                <option value="industrial">Industrial</option>
                                <option value="indoor">Indoor</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="locationType">Setting</label>
                            <select id="locationType" required>
                                <!-- Options will be populated by script -->
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="mapSize">Size</label>
                        <select id="mapSize">
                            <option value="size-20x20">20×20</option>
                            <option value="size-30x30" selected>30×30</option>
                            <option value="size-40x40">40×40</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="mapDescription">You step into...</label>
                        <textarea id="mapDescription" placeholder="A mystical forest clearing with ancient stone circles, winding paths, and hidden alcoves perfect for ambushes..." required></textarea>
                    </div>
                </div>
            </form>
            
            <button type="button" id="generate-btn" class="action-btn generate-btn">
                <span>Roll to Quest</span>
            </button>
            
            <div id="mapPreview" class="map-preview">
                <div class="preview-placeholder">
                    <p>Your map will appear here once generated</p>
                </div>
            </div>
        </section>

        <!-- Maps Gallery -->
        <section class="maps-gallery">
            <div class="gallery-header">
                <h2>Collections</h2>
                <div class="filter-section-dropdown">
                    <div class="filter-dropdown-group">
                        <select class="filter-dropdown" data-type="setting">
                            <option value="all">All Settings</option>
                            <!-- Options will be populated by script -->
                        </select>

                        <select class="filter-dropdown" data-type="terrain">
                            <option value="all">All Terrains</option>
                            <option value="forest">Forest</option>
                            <option value="grassland">Grassland</option>
                            <option value="hills">Hills</option>
                            <option value="mountain">Mountain</option>
                            <option value="desert">Desert</option>
                            <option value="tundra">Tundra</option>
                            <option value="jungle">Jungle</option>
                            <option value="swamp">Swamp</option>
                            <option value="ocean">Ocean</option>
                            <option value="coastal">Coastal</option>
                            <option value="underground">Underground</option>
                            <option value="underdark">Underdark</option>
                            <option value="badlands">Badlands</option>
                            <option value="feywild">Feywild</option>
                            <option value="shadowfell">Shadowfell</option>
                            <option value="urban">Urban</option>
                            <option value="volcanic">Volcanic</option>
                            <option value="industrial">Industrial</option>
                            <option value="indoor">Indoor</option>
                        </select>

                        <select class="filter-dropdown" data-type="size">
                            <option value="all">All Sizes</option>
                            <option value="size-20x20">20×20</option>
                            <option value="size-30x30">30×30</option>
                            <option value="size-40x40">40×40</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="maps-grid" id="mapsGrid">
                <!-- Generated maps will appear here -->
            </div>

            <p class="collection-warning">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 0.25rem;">
                    <path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
                </svg>
                Maps are stored temporarily (at the moment). Refreshing the page will clear all collections.
            </p>
        </section>
    </main>

    <!-- Floating Action Button -->
    <button class="fab" title="Quick Create">+</button>

    <!-- Map Preview Modal -->
    <div id="mapPreviewModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Your Map is Ready!</h3>
                <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close modal">×</button>
            </div>

            <div class="modal-body">
                <!-- Map preview image -->
                <div class="modal-map-preview">
                    <img id="modalMapImage" src="" alt="Generated map">
                </div>

                <!-- Map metadata -->
                <div class="modal-map-info">
                    <p id="modalMapName" class="map-name"></p>
                    <p id="modalMapDescription" class="map-description"></p>
                </div>
            </div>

            <div class="modal-actions">
                <button id="modalSaveBtn" class="modal-btn save-btn">Save to Collections</button>
                <button id="modalEditBtn" class="modal-btn edit-btn">Edit Map</button>
                <button id="modalRerollBtn" class="modal-btn reroll-btn">Reroll</button>
            </div>
        </div>
    </div>

    <!-- JavaScript modules -->
    <script src="/js/constants.js"></script>
    <script src="/js/apiClient.js"></script>
    <script src="/js/mapUtils.js"></script>
    <script src="/js/uiHandlers.js"></script>
    <script src="/js/modalController.js"></script>
    <script src="/js/mapGenerator.js"></script>
    <script src="/js/galleryManager.js"></script>
    <script src="/js/questGenerator.js"></script>
    
    <script>
        // Initialize app when DOM loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Initializing Fabled Campaigns...');
            try {
                // Initialize UI components first
                populateSettingDropdowns();
                initTabSwitching();
                initSmoothScrolling();
                initFAB();
                
                // Initialize core functionality
                initMapGeneration();
                initGalleryFiltering();
                
                // Initialize hamburger menu
                initHamburgerMenu();
                
                console.log('Fabled Campaigns initialized successfully');
            } catch (error) {
                console.error('Failed to initialize Fabled Campaigns:', error);
                alert('Application failed to load. Please refresh the page.');
            }
        });
    </script>
</body>
</html>
